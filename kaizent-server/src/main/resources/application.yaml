spring:
  application:
    name: kaizent
  config:
    # Loads a local .env file (git-ignored) from the working directory, if present.
    import: optional:file:.env[.properties]
  mvc:
    # Errors use RFC 9457 problem details (application/problem+json).
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/kaizent
    username: ${KAIZENT_DB_USER:kaizent}
    # No default: set KAIZENT_DB_PASSWORD in .env (see .env.example).
    password: ${KAIZENT_DB_PASSWORD}

server:
  # Bind to the loopback interface only (spec 0001 AC-5).
  address: 127.0.0.1
  port: 8080

kaizent:
  workspace:
    # Relative paths are resolved against the working directory (the repository root).
    path: examples/petclinic
  intake:
    poll-interval: 10s
  worker:
    poll-interval: 2s
  llm:
    profiles:
      # Overridable from .env or the environment (see .env.example).
      resolution:
        adapter: ${KAIZENT_LLM_RESOLUTION_ADAPTER:gemini-api}
        model: ${KAIZENT_LLM_RESOLUTION_MODEL:gemini-3.6-flash}
    # Credentials of the other API adapters (spec 0004). An adapter without them is not
    # configured: the application starts, and the calls of a step that uses it fail.
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:}

# Two scheduler threads: the intake poller keeps polling while the run worker waits for a
# model call. Each task still never runs concurrently with itself, so runs are processed one
# at a time (ADR-0023).
spring.task.scheduling.pool.size: 2

# Spring Modulith's time events (HourHasPassed and others) are not used. They would also turn
# on @Scheduled processing independently of kaizent.scheduling.enabled.
spring.modulith.moments.enabled: false

# Read by the gemini-api adapter. Without a key the application still starts, and runs fail
# with a clear message.
spring.ai.google.genai.api-key: ${GEMINI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
