# Local infrastructure for development (ADR-0009). Start it with: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kaizent
      POSTGRES_USER: ${KAIZENT_DB_USER:-kaizent}
      # Required, no default: set KAIZENT_DB_PASSWORD in .env (see .env.example).
      POSTGRES_PASSWORD: ${KAIZENT_DB_PASSWORD}
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql.
      - kaizent-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # CLI tools for the cli adapter (ADR-0030), only with the "cli" profile. Kaizent runs each
  # call in a new container with docker run; these services build the images and run the
  # tools' own login. For example:
  #   docker volume create kaizent-cli-codex
  #   docker compose --profile cli build codex-cli
  #   docker compose --profile cli run --rm codex-cli kaizent-codex login --device-auth
  codex-cli:
    profiles: [cli]
    build: docker/cli/codex
    image: kaizent-cli-codex
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - kaizent-cli-codex:/home/kaizent/.codex-login

  # Not validated yet (spec 0004 T10). These two only build the images: they use no login
  # volume, because the credential comes from .env as an environment variable.
  #   docker compose --profile cli build claude-code-cli antigravity-cli
  claude-code-cli:
    profiles: [cli]
    build: docker/cli/claude-code
    image: kaizent-cli-claude-code
    read_only: true
    tmpfs: [/tmp]

  antigravity-cli:
    profiles: [cli]
    build: docker/cli/antigravity
    image: kaizent-cli-antigravity
    read_only: true
    tmpfs: [/tmp]

volumes:
  kaizent-postgres:
  # The Codex login only; never read by Kaizent. The codex preset mounts it by this name.
  # External: create it once with "docker volume create kaizent-cli-codex"; compose never
  # creates or removes it, so "docker compose down -v" (an empty database) keeps the login.
  kaizent-cli-codex:
    external: true
