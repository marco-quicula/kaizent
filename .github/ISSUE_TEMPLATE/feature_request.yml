name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Kaizent grows in waves (see docs/roadmap.md). Larger features become specs before
        they are implemented (docs/specs/README.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, specs, ADRs or roadmap waves.
