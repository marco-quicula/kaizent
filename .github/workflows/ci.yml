# Builds and tests every pull request and every push to main (ADR-0026).
# No secrets and no real LLM calls (ADR-0020).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Cache Node and npm
        uses: actions/cache@v6
        with:
          path: |
            kaizent-console/node
            ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('pom.xml', 'kaizent-console/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Build and test
        run: ./mvnw -B verify
